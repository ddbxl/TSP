name: Deploy browser build to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/tsp/core.py"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp web/index.html web/style.css web/app.js web/worker.js _site/
          cp web/bridge.py _site/
          cp assets/icon.svg assets/favicon.png _site/
          # One engine serves both targets: src/tsp/core.py.
          cp src/tsp/core.py _site/tsp_core.py
          cp LICENSE _site/LICENSE.txt

      - name: Check every web file reached the site
        run: |
          missing=0
          for f in web/*.html web/*.css web/*.js web/bridge.py; do
            name=$(basename "$f")
            if [ ! -f "_site/$name" ]; then echo "missing from _site: $name"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "all web files copied"

      - name: Check the Python that runs in the browser compiles
        run: |
          python -c "
          import ast, pathlib, sys
          for name in ('src/tsp/core.py', 'web/bridge.py'):
              try:
                  ast.parse(pathlib.Path(name).read_text())
              except SyntaxError as exc:
                  sys.exit(f'{name} line {exc.lineno}: {exc.msg}')
              print(name, 'compiles')
          "

      - name: Check the engine imports nothing unavailable in Pyodide
        run: |
          python - <<'PY'
          import ast, sys
          tree = ast.parse(open("src/tsp/core.py").read())
          allowed = {
              "os", "re", "io", "contextlib", "unicodedata", "collections",
              "dataclasses", "pathlib", "typing", "pymupdf", "fitz",
              "__future__",
          }
          found = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  found.update(a.name.split(".")[0] for a in node.names)
              elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                  found.add(node.module.split(".")[0])
          extra = found - allowed
          if extra:
              sys.exit(f"core.py imports {sorted(extra)}; confirm Pyodide support first")
          print("engine imports look portable:", sorted(found))
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
