[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsp-token-saving-protocol"
version = "0.4.0"
description = "Turn PDFs into token-efficient text plus page images, entirely offline."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["pdf", "docx", "odt", "llm", "tokens", "text-extraction", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = ["pymupdf>=1.24.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pillow>=10.0", "ruff>=0.5", "pyyaml>=6.0", "markdown>=3.5"]

[project.scripts]
tsp = "tsp.cli:main"

[project.gui-scripts]
tsp-gui = "tsp.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsp = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py310"
